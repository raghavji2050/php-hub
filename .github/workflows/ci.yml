name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Lint / type-check (if configured)
        run: npm run --if-present lint && npm run --if-present check
      - name: Internal link check
        run: node scripts/check-links.mjs
